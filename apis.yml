aid: concentric-ai
name: Concentric AI
description: 'Concentric AI provides an AI-driven data security governance platform built on its
  proprietary Semantic Intelligence technology to autonomously discover, classify, monitor, and protect
  sensitive data across cloud and on-premises environments. The agentless platform spans Data Security
  Posture Management (DSPM), data loss prevention, data access governance, insider risk detection, and
  generative-AI data security (covering Claude, ChatGPT, Microsoft Copilot, Google Gemini, and Perplexity),
  connecting to 40+ data platforms and business applications including Snowflake, Amazon S3, Microsoft
  365, Salesforce, ServiceNow, and Google Workspace. Backed by Homebrew, Concentric AI was recognized as
  a 2026 Gartner Peer Insights Customers'' Choice for DSPM.'
